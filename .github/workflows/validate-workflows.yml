name: Validate organization workflows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-workflows:
    name: validate-workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout organization workflow definitions
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate reusable workflows with pinned actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_ARCHIVE_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 10 --max-time 90 "$url" --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          # actionlint 1.7.12 ainda usa metadata antiga para esta action v3.
          # O action.yml oficial declara client-id; o restante do lint continua ativo.
          "$RUNNER_TEMP/actionlint" -color=false \
            -ignore 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"' \
            -ignore 'input "client-id" is not defined in action "actions/create-github-app-token@v3"' \
            .github/workflows/*.yml
